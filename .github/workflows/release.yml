name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0-preview.1). Defaults to v<VERSION>.
        required: false
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Resolve version and tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          version="${tag#v}"
          prerelease="false"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: Build & Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            runtime: win-x64
          - name: Windows ARM64
            os: windows-2022
            runtime: win-arm64
          - name: macOS Intel
            os: macos-latest
            runtime: osx-x64
          - name: macOS Apple Silicon
            os: macos-latest
            runtime: osx-arm64
          - name: Linux x64
            os: ubuntu-22.04
            runtime: linux-x64
          - name: Linux ARM64
            os: ubuntu-22.04
            runtime: linux-arm64
    steps:
      - name: Checkout GitNest and pinned dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish (${{ matrix.runtime }})
        run: >
          dotnet publish src/SourceGit.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained true
          -p:DisableAOT=true
          -p:Version=${{ needs.version.outputs.version }}
          -o build/GitNest

      - name: Package Windows
        if: startsWith(matrix.runtime, 'win-')
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          ./build/scripts/package.win.ps1 -SourceDir build/GitNest -Version $env:VERSION -Runtime $env:RUNTIME -OutputDir artifacts/release

      - name: Build Windows x64 Installer
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
          }
          New-Item -ItemType Directory -Path artifacts/windows-x64 -Force | Out-Null
          Copy-Item -Path build/GitNest/* -Destination artifacts/windows-x64 -Recurse -Force
          ./build/scripts/build-installer.ps1 -SkipPublish -AppVersion $env:VERSION
          Copy-Item -Path "artifacts/installer/GitNest-Setup-$env:VERSION-win-x64.exe" -Destination artifacts/release/ -Force

      - name: Package macOS
        if: startsWith(matrix.runtime, 'osx-')
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          chmod +x build/scripts/package.osx-app.sh
          ./build/scripts/package.osx-app.sh
          mkdir -p artifacts/release
          mv build/GitNest-*.zip artifacts/release/

      - name: Install Linux packaging dependencies
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y curl desktop-file-utils dpkg-dev fakeroot rpm libfuse2 file binutils

      - name: Package Linux
        if: startsWith(matrix.runtime, 'linux-')
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x build/scripts/package.linux.sh
          ./build/scripts/package.linux.sh
          mkdir -p artifacts/release
          mv build/GitNest-*.tar.gz build/GitNest-*.AppImage build/GitNest-*.deb build/GitNest-*.rpm artifacts/release/

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, build]
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "GitNest v$VERSION" \
              --notes-file docs/release-notes.md \
              "${flags[@]}"
          fi
