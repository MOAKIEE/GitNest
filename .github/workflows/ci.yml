name: Windows CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout GitNest and pinned dependencies
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build and publish
        run: ./build/scripts/build-gitnest.ps1 -Publish
      - name: Run integration checks
        run: ./build/scripts/test-gitnest.ps1 | Tee-Object -FilePath artifacts/logs/integration-tests.log
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GitNest-verification-logs
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v7
        with:
          name: GitNest-windows-x64
          path: artifacts/windows-x64/
          if-no-files-found: error
          retention-days: 7
